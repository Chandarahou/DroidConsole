services:
  desktop-host:
    build: ./desktop-host
    container_name: dc-desktop-host
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - host-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Connect to the ADB server on the Windows host.
      # Host must run: adb kill-server && adb -a nodaemon server start
      - ADB_HOST=host.docker.internal
      - ADB_PORT=5037
      # Also set native ADB env vars so adb CLI itself connects to remote server
      - ANDROID_ADB_SERVER_ADDRESS=host.docker.internal
      - ANDROID_ADB_SERVER_PORT=5037

  web-frontend:
    build: ./web-frontend
    container_name: dc-web-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - desktop-host

volumes:
  host-data:
