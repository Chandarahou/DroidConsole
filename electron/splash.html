<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-app-region: drag;
  }

  .logo-container {
    position: relative;
    width: 120px;
    height: 120px;
    animation: bounce 1.2s ease-in-out infinite;
  }

  .logo-container img {
    width: 120px;
    height: 120px;
    border-radius: 24px;
    object-fit: cover;
    filter: drop-shadow(0 0 30px rgba(100, 160, 255, 0.4));
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140px;
    height: 140px;
    transform: translate(-50%, -50%);
    border-radius: 30px;
    background: radial-gradient(circle, rgba(100, 160, 255, 0.15) 0%, transparent 70%);
    animation: pulse-glow 1.2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-18px); }
    50% { transform: translateY(0); }
    75% { transform: translateY(-8px); }
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  }

  .title {
    margin-top: 28px;
    color: #89b4fa;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 0.8s ease 0.3s forwards;
  }

  .subtitle {
    margin-top: 6px;
    color: #585b70;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 0.8s ease 0.6s forwards;
  }

  .loading-bar {
    margin-top: 32px;
    width: 180px;
    height: 3px;
    background: #1e1e2e;
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    animation: fade-in 0.5s ease 1s forwards;
  }

  .loading-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #89b4fa, #a6e3a1);
    border-radius: 2px;
    animation: load-progress 2.5s ease 1s forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  @keyframes load-progress {
    0% { width: 0%; }
    30% { width: 40%; }
    60% { width: 70%; }
    90% { width: 90%; }
    100% { width: 100%; }
  }
</style>
</head>
<body>
  <div class="logo-container">
    <div class="glow"></div>
    <img id="logo" src="" alt="DroidConsole">
  </div>
  <div class="title">DroidConsole</div>
  <div class="subtitle">Multi-Device Android Manager</div>
  <div class="loading-bar">
    <div class="loading-bar-fill"></div>
  </div>

  <script>
    // Load icon from the correct path
    const img = document.getElementById('logo');
    // The splash window receives iconPath via query string
    const params = new URLSearchParams(window.location.search);
    img.src = params.get('icon') || '';
  </script>
</body>
</html>
